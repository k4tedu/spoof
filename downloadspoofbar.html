<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming Video Player - PoC</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            text-align: center;
            padding-top: 10vh;
            transition: background-color 0.5s;
        }
        .card {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 550px;
        }
        .btn {
            background-color: #0078d4; /* Warna khas tombol Microsoft */
            color: white;
            padding: 14px 28px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            display: inline-block;
            margin-top: 25px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn:hover {
            background-color: #005a9e;
        }
        .warning-text {
            color: #d83b01;
            font-weight: bold;
            background-color: #fde7e9;
            padding: 10px;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <h2>Aktifkan Pemutar Mini (Picture-in-Picture)</h2>
        <p>Untuk pengalaman menonton tanpa gangguan sambil membuka tab lain, Anda perlu membuka pemutar di jendela terpisah.</p>
        
        <div class="warning-text">
            Instruksi: Klik Kanan pada tombol di bawah ini, lalu pilih "Open link in new window"
        </div>
        
        <a id='aid' class="btn" target="_blank" onclick="document.body.requestFullscreen();" href='https://cr.kungfoo.net/yao/downloads/multiple/redirect_download.php' download>Buka Pemutar Mini</a>
    </div>

    <script>
        // Logika untuk mengubah UI menjadi halaman tiruan HANYA jika fullscreen berhasil dipicu
        var checkFullscreen = setInterval(function() {
            if (document.fullscreenElement) {
                // Menghapus UI asli dan menggantinya dengan antarmuka video palsu
                document.body.style.backgroundColor = "#000";
                document.body.style.color = "#fff";
                document.body.style.paddingTop = "30vh";
                
                document.body.innerHTML = `
                    <div style="text-align: center; font-family: 'Segoe UI', sans-serif;">
                        <h2 style="color: #0078d4; font-weight: normal;">Memuat Pemutar Video...</h2>
                        <p style="color: #cccccc;">Menyambungkan ke server streaming, harap tunggu.</p>
                        
                        <div style="margin-top: 40px; border: 4px solid #222; border-top: 4px solid #0078d4; border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; display: inline-block;"></div>
                        
                        <style>
                            @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
                        </style>
                    </div>
                `;
                
                // Hentikan interval setelah UI berhasil diganti
                clearInterval(checkFullscreen);
            }
        }, 500);
    </script>
</body>
</html>
