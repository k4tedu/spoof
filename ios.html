<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Uji Coba Interaksi Alur Kerja UI</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 320px;
            text-align: center;
        }
        /* Tombol Awal yang Menarik Perhatian */
        .btn-attractive {
            background: linear-gradient(135deg, #007aff, #0056b3);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,122,255,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-attractive:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,122,255,0.4);
        }
        .btn-attractive:active {
            transform: translateY(0);
        }
        /* Form Login yang Awalnya Tersembunyi */
        .login-form {
            display: none;
            text-align: left;
            animation: fadeIn 0.5s ease forwards;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #333;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #34c759;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- FASE 1: Tombol Awal yang Menarik -->
    <button id="main-button" class="btn-attractive" onclick="handleInitialClick()">
        Klaim Hadiah & Lanjutkan
    </button>

    <!-- FASE 3: Form Data Pribadi (Muncul Setelah Alert Ditutup) -->
    <div id="auth-form" class="login-form">
        <h3 style="margin-top: 0; color: #1d1d1f; text-align: center;">Verifikasi Akun</h3>
        <p style="font-size: 13px; color: #666; text-align: center; margin-bottom: 20px;">
            Silakan masuk kembali untuk mengonfirmasi identitas Anda.
        </p>
        <form onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label for="username">Email atau Username:</label>
                <input type="text" id="username" placeholder="contoh@gmail.com" required>
            </div>
            <div class="form-group">
                <label for="password">Kata Sandi:</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Konfirmasi</button>
        </form>
    </div>
</div>

<script>
function handleInitialClick() {
    // FASE 2: Memicu dialog alert dengan rekayasa string teks (Text Spoofing)
    alert('"apple.com" says\n                                                              \nYou must provide the email address and password before logging in.');

    // Eksekusi di bawah ini HANYA akan berjalan SETELAH pengguna menekan tombol "Oke" pada alert
    document.getElementById('main-button').style.display = 'none';
    document.getElementById('auth-form').style.display = 'block';
}

function handleSubmit(event) {
    event.preventDefault();
    alert("Simulasi Pengujian Selesai. Data berhasil diproses dalam simulasi.");
}
</script>

</body>
</html>
