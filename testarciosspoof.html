<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safari iOS Address Bar Test</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f5;
        }

        .container {
            text-align: center;
            padding: 30px;
        }

        button {
            padding: 14px 28px;
            font-size: 18px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }

        #marker {
            margin-top: 20px;
            padding: 15px;
            background: #fff;
            border-radius: 8px;
            border: 2px solid red;
        }
    </style>

</head>

<body>

    <div class="container" id="app">

        <h2>Safari iOS Address-Bar Test</h2>

        <button id="start">
            Start Test
        </button>

        <div id="marker">
            ATTACKER-CONTROLLED CONTENT
        </div>

    </div>

    <script>
        document.getElementById("start").addEventListener("click", () => {

            /*
             * Make the origin-controlled content unmistakable.
             */
            document.getElementById("app").innerHTML = `
    <h1 style="color:red;">
      ADDRESS BAR TEST
    </h1>

    <div style="
      padding:20px;
      border:3px solid red;
      background:white;
    ">
      <strong>ATTACKER-CONTROLLED CONTENT</strong>
      <br><br>
      Expected origin:
      <br>
      <code>k4tedu.github.io</code>

      <br><br>

      This page must NOT be confused with Google.
    </div>
  `;

            /*
             * Start top-level navigation.
             *
             * Port 8888 is intentionally used as the test
             * destination.
             */
            const target = "https://www.google.com/csi";

            setTimeout(() => {
                window.location.href = target;
            }, 999);

        });
    </script>

</body>

</html>
