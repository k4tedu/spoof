<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Browser Notification Test Harness</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    margin:0;
    background:#f2f3f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.chat{
    width:380px;
    background:#fff;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.header{
    background:#0078d4;
    color:#fff;
    padding:15px;
}

.header small{
    display:block;
    margin-top:5px;
    opacity:.9;
}

.messages{
    height:320px;
    overflow:auto;
    padding:15px;
    background:#fafafa;
}

.msg{
    background:#ececec;
    border-radius:15px;
    padding:10px 15px;
    margin-bottom:12px;
}

.time{
    font-size:11px;
    color:#777;
    margin-top:5px;
}

.footer{
    display:flex;
    padding:10px;
    gap:10px;
    border-top:1px solid #ddd;
}

input{
    flex:1;
    padding:10px;
}

button{
    padding:10px 18px;
    cursor:pointer;
}

.log{

    background:#111;
    color:#00ff7f;
    padding:10px;
    height:160px;
    overflow:auto;
    font-size:12px;
    font-family:monospace;

}

</style>
</head>

<body>

<div class="chat">

<div class="header">

Notification Origin Test

<small id="permission">
Permission :
Checking...
</small>

</div>

<div class="messages" id="messages">

<div class="msg">

Selamat datang.

<div class="time"></div>

</div>

</div>

<div class="footer">

<input
id="text"
value="testingg"
placeholder="Ketik pesan">

<button id="send">

Kirim

</button>

</div>

<div class="log" id="log"></div>

</div>

<script>

const logBox=document.getElementById("log");

function log(message){

const now=new Date().toLocaleTimeString();

logBox.innerHTML+=`[${now}] ${message}<br>`;

logBox.scrollTop=logBox.scrollHeight;

console.log(message);

}

function addMessage(text){

const div=document.createElement("div");

div.className="msg";

div.innerHTML=`
${text}
<div class="time">${new Date().toLocaleTimeString()}</div>
`;

const container=document.getElementById("messages");

container.appendChild(div);

container.scrollTop=container.scrollHeight;

}

async function init(){

if(!("Notification" in window)){

document.getElementById("permission").textContent=
"Notification API unsupported";

return;

}

if(Notification.permission==="default"){

await Notification.requestPermission();

}

document.getElementById("permission").textContent=
"Permission : "+Notification.permission;

log("Current Origin : "+location.origin);

log("Current URL    : "+location.href);

}

async function send(){

const text=document.getElementById("text").value.trim();

if(!text)return;

addMessage(text);

log("Button clicked");

log("performance.now() : "+performance.now().toFixed(2));

if(Notification.permission==="granted"){

new Notification(

'Victim Code (" ><h1>'+text+'</h1>")',

{
body:"Pesan baru diterima",
icon:"https://via.placeholder.com/128"
}

);

log("Notification dispatched");

}else{

log("Notification permission denied");

}

//
// Tempat menambahkan eksperimen browser
//

setTimeout(()=>{

log("setTimeout(0) executed");

},0);

queueMicrotask(()=>{

log("queueMicrotask executed");

});

Promise.resolve().then(()=>{

log("Promise resolved");

});

requestAnimationFrame(()=>{

log("requestAnimationFrame");

});

}

document
.getElementById("send")
.addEventListener("click",send);

init();

</script>

</body>
</html>
