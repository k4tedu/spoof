<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penelitian Keamanan UI</title>
    <style>
        body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f0f2f5; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 9999;
        }
        .btn { padding: 20px 40px; background: #1a73e8; color: white; border-radius: 8px; font-weight: bold; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="btn">Lanjutkan ke Google</div>
    </div>

    <script>
        const overlay = document.getElementById('overlay');

        overlay.addEventListener('click', async () => {
    const shareData = {
        title: 'System Update',
        text: 'Lanjutkan sinkronisasi akun?',
        url: 'https://google.com' // Menyamarkan URL tujuan
    };

    // STRATEGI: Pemicuan Simultan (Tanpa Delay)
    // Beberapa versi browser membolehkan dua aksi jika dieksekusi tepat bersamaan
    
    // 1. Picu Share terlebih dahulu (tanpa 'await' agar tidak berhenti)
    navigator.share(shareData).catch(e => console.log(e));

    // 2. Langsung buka tab baru di baris berikutnya
    window.open('https://www.google.com', '_blank');
});
    </script>
</body>
</html>
